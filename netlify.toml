[build]
  command = "npm install --prefix client && npm run build --prefix client && npm install --prefix server"
  publish = "client/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # Leave empty so the SPA calls same-origin /api (Netlify Functions)
  VITE_API_URL = "/api"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
